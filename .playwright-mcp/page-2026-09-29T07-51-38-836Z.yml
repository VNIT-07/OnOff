        - generic [ref=f8e158]:
          - generic [ref=f8e159]: The Brescia Think Tank
          - heading "1962 Becoming Flos" [level=2] [ref=f8e160]:
            - text: "1962"
            - generic [ref=f8e161]: Becoming Flos
          - generic [ref=f8e162]:
            - generic [ref=f8e163]: Sergio Gandini
            - generic [ref=f8e164]: Arco Luminaire
            - generic [ref=f8e165]: Taccia
            - generic [ref=f8e166]: Carrara Marble
        - generic [ref=f8e167]:
          - paragraph [ref=f8e168]:
            - text: "How does an industry become a laboratory where the idea of \"lamp\" is revolutionized? For Sergio Gandini, who began to manage Flos in 1963, there is no contradiction between the business project and creative imagination: combined they will lead his company to success. The industrial infrastructure of Brescia is perfect for giving designers maximum freedom of action, be it the"
            - emphasis [ref=f8e169]: Jucker
            - text: lamp by Tobia Scarpa — inspired by the Bauhaus — or the revolutionary
            - emphasis [ref=f8e170]: Arco dei Castiglioni
            - text: .
          - paragraph [ref=f8e171]: First and for a long time unique among the Italian design industries, Flos bases its strategies on what today would be called a Think Tank. Gandini and his exclusive designers (Castiglioni, Scarpa) decide together products, communication, image... Together they trace the lines of their desires, the design lines that will lead to the creation of the most iconic lamps in the history of lighting.
