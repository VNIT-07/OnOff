        - generic [ref=f8e325]:
          - paragraph [ref=f8e326]:
            - text: Developing a new reality and identity for Flos also means the courage of radical choices. Facing the challenge of the invasion of LEDs on the planet Light is the first act of a second revolution in production, which begins early, in the early 2000s, when Flos acquires from Federico Martinez the Spanish company Antares, to become
            - strong [ref=f8e327]: Flos Architectural
            - text: ", dedicated to professional lighting for large areas, public spaces and environments."
          - paragraph [ref=f8e328]:
            - text: Piero Gandini discovers and hires new designers, who imagine openings, additions, autonomous lighting elements. These new designs become architecture of light, with the use of the most advanced technology. But the same technology can generate real works of art, like the sculpture lamps
            - emphasis [ref=f8e329]: Ohhh!!!
            - text: and
            - emphasis [ref=f8e330]: Ahhh!!!
            - text: "by Starck in crystal Baccarat, animated by phrases (Truisms) of the American artist Jenny Holzer that flow on LED: critical statements on the values of consumerism."
