        - generic [ref=f8e122]:
          - generic [ref=f8e123]: Genesis & Cocoon Era
          - heading "1960 A bright idea" [level=2] [ref=f8e124]:
            - text: "1960"
            - generic [ref=f8e125]: A bright idea
          - generic [ref=f8e126]:
            - generic [ref=f8e127]: Achille Castiglioni
            - generic [ref=f8e128]: Pier Giacomo Castiglioni
            - generic [ref=f8e129]: Tobia Scarpa
            - generic [ref=f8e130]: Dino Gavina
        - generic [ref=f8e131]:
          - paragraph [ref=f8e132]: "At the origin of Flos there is a bright thought: the idea of giving birth to objects suitable to change the way of living, not only of Italians. So at the beginning of the 60s a certain Mr Gavina, with the small producer of Merano Eisenkeil, gets in the lead — after having created many new furniture (with the brothers Achille and Pier Giacomo Castiglioni, Afra and Tobia Scarpa and other masters of design) — that it is also time to create new lamps."
          - paragraph [ref=f8e133]:
            - text: So the Castiglioni and the Scarpa, with the cocoon technique, conceived in the USA and experimented by Eisenkeil, begin to make lamps such as the
            - emphasis [ref=f8e134]: Taraxacum
            - text: or the
            - emphasis [ref=f8e135]: Fantasma
            - text: ". Many other lamps, beautiful and surprising, follow these first ones: so already from its prehistory Flos ("
            - emphasis [ref=f8e136]: Fiore
            - text: ", in Latin, name that Pier Giacomo Castiglioni chooses for her) finds himself reinventing the idea of artificial lighting."
