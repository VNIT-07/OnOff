        - generic [ref=f8e211]:
          - paragraph [ref=f8e212]: "The 1972 exhibition “Italy: The New Domestic Landscape” at MoMA (Museum of Modern Art) in New York, the most important contemporary art museum in America, reveals to the world an unprecedented popular Italian phenomenon in industrial and artistic culture. Flos appears in the exhibition with many lamps, especially by the Castiglioni brothers: this is its international consecration as an avant-garde enterprise and since then the popularity and development of the company go hand in hand."
          - paragraph [ref=f8e213]: Production (with new factories), the market (with the first foreign subsidiaries) and the catalogue of products, also with the acquisition of Gino Sarfatti’s Arteluce, grew between the 1970s and the 1980s. And it is yet another exhibition, the great solo exhibition of Achille Castiglioni that since 1984 has been held in museums of eight European capitals, from Vienna to Madrid, to confirm that the Flos experience is unique, unrepeatable and unpredictable in its continuous evolution.
