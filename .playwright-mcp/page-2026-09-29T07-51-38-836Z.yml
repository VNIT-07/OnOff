          - paragraph [ref=f8e433]: The global pandemic was not only a major blow to the world economy but also a test bed for Industry 4.0 on how to survive a substantial blockage of planetary physical communications, which until then could only seem science fiction.
          - paragraph [ref=f8e434]:
            - text: Even in this very difficult circumstance, Flos reacted with a strong push to the development of digital dialogue with its audience and partners, through original projects and contents for e-commerce as in the creation of tools and events that a wider audience — from professional architects to private collectors — could experience. Notable initiatives include
