            - generic [ref=f8e289]: Konstantin Grcic
            - generic [ref=f8e290]: Bruno Le Moult
        - generic [ref=f8e291]:
          - paragraph [ref=f8e292]: "Even with Piero Gandini, Flos focuses on the harmony between iconic shapes, craftsmanship and technology for the series: but the decisive step for change is to accept that there are so many languages of the contemporary object, at least as the languages of the World."
          - paragraph [ref=f8e293]:
            - text: "Thus Flos enlisted the most promising talents of international design: from the Australian “futuribile” Marc Newson, with the"
            - emphasis [ref=f8e294]: Helice Lamp
            - text: (1993), the English prophet of minimalist design Jasper Morrison, up to Konstantin Grcic, the most refined and eclectic of German designers. International talents such as the advertising superstar Bruno Le Moult and the famous photographer Jean-Baptiste Mondino are also present in the communication. When founder Sergio Gandini passed away at the turn of the millennium, Flos was already well-equipped to face the challenges of globalization.
