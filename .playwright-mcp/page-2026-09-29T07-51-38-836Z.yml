        - generic [ref=f8e403]:
          - paragraph [ref=f8e404]: It is in the universal nature of Flos products the design DNA that leads it to assume a leadership function in the global lighting market. To support a catalogue of so many iconic products, even a historic industry must equip itself with more powerful tools, starting with financial ones.
          - paragraph [ref=f8e405]:
            - text: From the first alliance with Investindustrial in 2014, the global identity of Flos matures since 2018 with the foundation of
            - strong [ref=f8e406]: Design Holding
            - text: ", where Investindustrial joins the Carlyle Group, creating a preeminent luxury hub that unites furniture (B&B Italia, Maxalto, Azucena, Arclinea) with lighting (Flos, Louis Poulsen). Under the “Flos for Planet” commitment, circular sustainability, eco-materials and modular repairability become core industrial mandates."
