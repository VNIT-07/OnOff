        - generic [ref=f8e256]:
          - paragraph [ref=f8e257]:
            - text: Every great success comes from the courage of a bet. Already in the mid-80s Sergio Gandini meets the still young Philippe Starck and starts the production of his fairy-tale lamp
            - emphasis [ref=f8e258]: Arà
            - text: ". His son Piero develops it industrially: he sensed the genius of the most postmodern of the new designers and decided to mass-produce a plastic object for a hotel in New York: a sort of icon of the lamp, the lamp"
            - emphasis [ref=f8e259]: Miss Sissi
            - text: .
          - paragraph [ref=f8e260]: “What everyone unconsciously thinks is a lamp,” Starck will say, when it turns out to be a resounding success (8,000 pieces sold in the first 10 days, 100,000 in a year). It is the first of a long series of iconic best-sellers generated with Starck or Castiglioni, which with new technologies and materials update the Flos image and open up other avenues of research and development.
