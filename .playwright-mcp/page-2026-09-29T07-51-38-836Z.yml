        - generic [ref=f8e356]:
          - paragraph [ref=f8e357]: If the future is already today, what is the artificial light of tomorrow? Flos advances in these years with the full awareness that there are and will be more and more types of lighting, radically new. They must be studied, developed and produced with an attitude of rupture towards the existing state of the art and, at the same time, following the rigorous design culture on which the company was founded.
          - paragraph [ref=f8e358]:
            - text: "All artificial environments must be redefined: from the domestic realm (Decorative), to workplaces and museums (Architectural), and the spaces of nature — gardens, parks, landscapes — with"
            - strong [ref=f8e359]: Flos Outdoor
            - text: ". As Philippe Starck remarks:"
            - emphasis [ref=f8e360]: “There is no difference between artificial and natural light. It’s just a matter of transmission, ions and photons are always the same.”
            - text: Here begins the luminous collaboration with Michael Anastassiades, whose IC Lights achieve instant cultural immortality.
